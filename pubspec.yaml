name: twelve_step_guide
description: "12 Step Guide — the unified Flutter app replacing the native iOS and Android builds."
publish_to: 'none'

# 2.0.0+100 replaces the native apps: iOS shipped 1.51, Android versionCode 29.
# Build numbers only go up (FLUTTER_ARCHITECTURE.md §0).
version: 2.0.0+100

environment:
  sdk: ^3.13.5
  # Pinned in .fvmrc and in CI; this is the floor.
  flutter: ">=3.47.7"

# Packages arrive with the phase that needs them (FLUTTER_ARCHITECTURE.md §15).
dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  background_downloader: ^9.6.4
  connectivity_plus: ^7.0.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_platform_interface: ^1.4.1
  in_app_purchase_storekit: ^0.4.13
  in_app_review: ^2.0.12
  intl: ^0.20.3
  just_audio: ^0.10.6
  markdown: ^7.3.1
  material_symbols_icons: ^4.2960.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod: ^3.4.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Writes the native launch screens from flutter_native_splash: below (F-001). Re-run after a
  # change: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # The literature (D-003) and generated data. content/archive/ is not bundled.
  assets:
    - assets/content_index.json
    - assets/audio/catalogue.json
    - assets/quotes.txt
    - assets/sounds/
    - assets/images/
    - assets/images/albums/
    - content/steps/
    - content/traditions/
    - content/readings/
    - content/prayers/
    - content/sobriety-tips/
    - content/big-book/
    - content/stories-1st-edition/
    - content/stories-2nd-edition/
    - content/transcripts/joe-and-charlie/
    - content/transcripts/big-book/
  # `flutter run` with no --flavor builds dev. Pass the matching config too:
  #   flutter run --dart-define-from-file=config/dev.json
  default-flavor: dev

# Launch screen (F-001): the icon on the app's background colour, light and dark, then straight
# to the first screen. Images come from tool/build_icons.py.
flutter_native_splash:
  color: "#F6F7FB"
  color_dark: "#0E1017"
  image: assets/branding/splash/splash-icon.png
  image_dark: assets/branding/splash/splash-icon.png
  android_12:
    image: assets/branding/splash/splash-android12.png
    image_dark: assets/branding/splash/splash-android12.png
    icon_background_color: "#4F9FEA"
    icon_background_color_dark: "#4F9FEA"
    color: "#F6F7FB"
    color_dark: "#0E1017"
  android: true
  ios: true
  web: false
  fullscreen: false
