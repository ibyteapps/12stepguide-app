name: twelve_step_guide
description: "12 Step Guide — the unified Flutter app replacing the native iOS and Android builds."
publish_to: 'none'

# 2.0.0+100 replaces the native apps: iOS shipped 1.51, Android versionCode 29.
# Build numbers only go up (FLUTTER_ARCHITECTURE.md §0).
version: 2.0.0+100

environment:
  sdk: ^3.13.5
  # Pinned in .fvmrc and in CI; this is the floor.
  flutter: ">=3.47.7"

# Packages arrive with the phase that needs them (FLUTTER_ARCHITECTURE.md §15).
dependencies:
  audio_session: ^0.2.4
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  in_app_review: ^2.0.12
  intl: ^0.20.3
  just_audio: ^0.10.6
  markdown: ^7.3.1
  material_symbols_icons: ^4.2960.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod: ^3.4.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # The literature (D-003) and generated data. content/archive/ is not bundled.
  assets:
    - assets/content_index.json
    - assets/audio/catalogue.json
    - assets/quotes.txt
    - assets/sounds/
    - assets/images/
    - content/steps/
    - content/traditions/
    - content/readings/
    - content/prayers/
    - content/sobriety-tips/
    - content/big-book/
    - content/stories-1st-edition/
    - content/stories-2nd-edition/
    - content/transcripts/joe-and-charlie/
    - content/transcripts/big-book/
  # `flutter run` with no --flavor builds dev. Pass the matching config too:
  #   flutter run --dart-define-from-file=config/dev.json
  default-flavor: dev
